<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Property Scout</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

* { box-sizing: border-box; }
body { margin: 0; }

.ps-root {
  --ink: #000000;
  --ink-dim: #5a6472;
  --line: #dde3ec;
  --panel: #f7f9fc;
  --bg: #ffffff;
  --cyan: #2b6f86;
  --amber: #b9770e;
  --red: #c1432f;
  --green: #2f8f5b;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 28px 20px 60px;
}

.ps-header { max-width: 1040px; margin: 0 auto 20px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.ps-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); margin-bottom: 4px; }
.ps-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 27px; margin: 0 0 4px; letter-spacing: -0.01em; }
.ps-sub { color: var(--ink-dim); font-size: 13.5px; margin: 0; max-width: 620px; line-height: 1.5; }

.ps-container { max-width: 1040px; margin: 0 auto; }

.ps-add-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin-bottom: 18px; }
.ps-add-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ps-input { flex: 1; min-width: 200px; background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 9px 11px; border-radius: 4px; font-size: 13.5px; font-family: 'Inter', sans-serif; }
.ps-input::placeholder { color: #9aa7bd; }
.ps-input:focus { outline: none; border-color: var(--cyan); }
.ps-input-nick { flex: 0 0 190px; min-width: 140px; }

.ps-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.03em; text-transform: uppercase; border: 1px solid var(--cyan); background: #fff; color: var(--cyan); padding: 9px 14px; border-radius: 4px; cursor: pointer; transition: background 0.15s, color 0.15s; white-space: nowrap; }
.ps-btn:hover { background: var(--cyan); color: #fff; }
.ps-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.ps-btn-amber { border-color: var(--amber); color: var(--amber); }
.ps-btn-amber:hover { background: var(--amber); color: #fff; }
.ps-btn-red { border-color: var(--red); color: var(--red); }
.ps-btn-red:hover { background: var(--red); color: #fff; }
.ps-btn-small { padding: 6px 10px; font-size: 10.5px; }

.ps-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.ps-search { flex: 1; min-width: 180px; background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 8px 11px; border-radius: 4px; font-size: 13px; }
.ps-search:focus { outline: none; border-color: var(--cyan); }
.ps-filter { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 8px 10px; border-radius: 4px; font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; cursor: pointer; }
.ps-count { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; }

.ps-empty { text-align: center; padding: 50px 20px; color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; border: 1px dashed var(--line); border-radius: 6px; }

.ps-list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ps-row { border-bottom: 1px solid var(--line); background: #fff; }
.ps-row:last-child { border-bottom: none; }

.ps-row-summary { display: grid; grid-template-columns: 34px 14px 1.4fr 1fr 24px 28px 28px; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
.ps-row-summary:hover { background: var(--panel); }
.ps-row-idx { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-dim); }
.ps-dot { width: 9px; height: 9px; border-radius: 50%; }
.dot-researching { background: var(--amber); }
.dot-shortlisted { background: var(--green); }
.dot-visited { background: var(--cyan); }
.dot-rejected { background: var(--red); }
.ps-row-nick { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-row-chip { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-water-flag { font-size: 13px; text-align: center; }
.ps-chevron { font-size: 12px; color: var(--ink-dim); text-align: center; transition: transform 0.15s; }
.ps-chevron.open { transform: rotate(90deg); }
.ps-row-del { background: none; border: none; color: #b9c2d4; cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 3px; }
.ps-row-del:hover { color: #fff; background: var(--red); }

.ps-detail { display: none; padding: 4px 14px 18px; background: var(--panel); border-top: 1px solid var(--line); }
.ps-detail.open { display: block; }

.ps-nick-edit { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; background: transparent; border: none; border-bottom: 1px dashed var(--line); color: var(--ink); padding: 4px 0; width: 100%; margin: 10px 0 2px; }
.ps-nick-edit:focus { outline: none; border-bottom-color: var(--cyan); }
.ps-link { font-size: 11.5px; color: var(--cyan); text-decoration: none; font-family: 'IBM Plex Mono', monospace; word-break: break-all; }
.ps-link:hover { text-decoration: underline; }

.ps-status-row { display: flex; justify-content: flex-end; margin: -30px 0 8px; }
.ps-status-select { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 6px 9px; border-radius: 4px; cursor: pointer; }

.ps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin: 10px 0; }
.ps-field { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; }
.ps-field-label { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.ps-field-link-btn { color: var(--cyan); text-decoration: none; font-size: 11px; }
.ps-field-value { font-size: 13px; line-height: 1.4; min-height: 16px; outline: none; cursor: text; }
.ps-field-value:empty::before { content: '— click to fill —'; color: #b0b9cb; font-style: italic; }

.ps-section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; }
.ps-section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.ps-prompt-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.ps-import-box { width: 100%; background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 9px 11px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; min-height: 52px; resize: vertical; }
.ps-import-box:focus { outline: none; border-color: var(--cyan); }

.ps-notes { width: 100%; background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 9px 11px; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 13px; min-height: 44px; resize: vertical; }
.ps-notes:focus { outline: none; border-color: var(--cyan); }

.ps-custom-row { display: flex; gap: 8px; margin-bottom: 6px; }
.ps-custom-row input { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 7px 9px; border-radius: 4px; font-size: 12.5px; font-family: 'Inter', sans-serif; }
.ps-custom-key { flex: 0 0 150px; }
.ps-custom-val { flex: 1; }
.ps-custom-del { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 4px; cursor: pointer; padding: 0 10px; font-size: 13px; }
.ps-custom-del:hover { color: var(--red); border-color: var(--red); }

.ps-status-msg { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--green); min-height: 14px; margin-top: 6px; }
.ps-loading { text-align: center; padding: 36px; color: var(--ink-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

.ps-storage-bar { display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 14px; flex-wrap: wrap; }
.ps-storage-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ps-storage-ok { background: var(--green); }
.ps-storage-off { background: var(--red); }
.ps-storage-link { color: var(--cyan); cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; font-size: inherit; padding: 0; }
.ps-settings-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ps-settings-panel input { flex: 1; min-width: 260px; background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 8px 10px; border-radius: 4px; font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; }
.ps-error-banner { background: #fdecea; border: 1px solid var(--red); color: var(--red); padding: 10px 14px; border-radius: 6px; font-size: 12.5px; margin-bottom: 14px; }
</style>
</head>
<body>

<div class="ps-root" id="psRoot">
  <div class="ps-header">
    <div class="ps-eyebrow">SITE SURVEY LOG</div>
    <h1 class="ps-title">Property Scout</h1>
    <p class="ps-sub">Paste a Google Maps link to log a property. Click a row to see the full checklist and add research findings.</p>
  </div>

  <div class="ps-container">
    <div class="ps-add-card">
      <div class="ps-add-row">
        <input class="ps-input" id="psNewLink" type="text" placeholder="Paste Google Maps link…" />
        <input class="ps-input ps-input-nick" id="psNewNick" type="text" placeholder="Nickname" />
        <button class="ps-btn ps-btn-amber" onclick="psAddProperty()">+ Add property</button>
      </div>
    </div>

    <div id="psStorageBar"></div>
    <div id="psSettingsPanel"></div>

    <div class="ps-toolbar">
      <input class="ps-search" id="psSearch" type="text" placeholder="Filter by nickname…" oninput="render()" />
      <select class="ps-filter" id="psFilterStatus" onchange="render()">
        <option value="">All statuses</option>
        <option value="Researching">Researching</option>
        <option value="Shortlisted">Shortlisted</option>
        <option value="Visited">Visited</option>
        <option value="Rejected">Rejected</option>
      </select>
      <div class="ps-count" id="psCount"></div>
    </div>

    <div id="psList"><div class="ps-loading">Loading saved properties…</div></div>
  </div>
</div>

<script>
(function() {
  const FIELD_DEFS = [
    { key: 'carTimeToCyberHub', label: 'Car → Cyber Hub' },
    { key: 'walkingTimeToEurokids', label: 'Walk → Nearest Eurokids' },
    { key: 'nearestPark', label: 'Nearest Park' },
    { key: 'areaReview', label: 'Area / Society Review' },
    { key: 'carTimeToMall', label: 'Car → Nearest Mall' },
    { key: 'waterlogging', label: 'Waterlogging History' },
  ];
  const STATUSES = ['Researching', 'Shortlisted', 'Visited', 'Rejected'];
  const LS_PREFIX = 'propertyScout:';
  const RISK_WORDS = /waterlog|flood|submerg|inundat|stuck|drain(age)? (issue|problem)|monsoon.*(risk|issue)/i;
  const SAFE_WORDS = /\bno\b.*(waterlog|flood|history|record)|no (known|reported|significant) (waterlogging|flooding)|not (a )?flood/i;

  let properties = [];
  let expandedId = null;
  let settingsOpen = false;
  let connectionOk = false;
  let loadError = null;

  function uid() { return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function getScriptUrl() { try { return localStorage.getItem(LS_PREFIX + 'scriptUrl') || ''; } catch (e) { return ''; } }
  function setScriptUrl(url) { try { localStorage.setItem(LS_PREFIX + 'scriptUrl', url); } catch (e) {} }

  async function apiList() {
    const url = getScriptUrl();
    if (!url) return [];
    const res = await fetch(url, { method: 'GET' });
    if (!res.ok) throw new Error('Request failed (' + res.status + ')');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Sheet returned an error');
    return data.properties || [];
  }

  function apiSave(p) {
    const url = getScriptUrl();
    if (!url) return Promise.resolve();
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'save', property: p })
    }).then(res => { if (!res.ok) throw new Error('Save failed'); });
  }

  function apiDelete(id) {
    const url = getScriptUrl();
    if (!url) return Promise.resolve();
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: id })
    }).then(res => { if (!res.ok) throw new Error('Delete failed'); });
  }

  function saveProperty(p) {
    apiSave(p).then(() => { connectionOk = true; renderStorageBar(); })
      .catch(err => { console.error(err); connectionOk = false; showMsg(p.id, 'Sync failed — check your connection'); renderStorageBar(); });
  }

  function deleteProperty(id) {
    properties = properties.filter(p => p.id !== id);
    render();
    apiDelete(id).then(() => { connectionOk = true; renderStorageBar(); })
      .catch(err => { console.error(err); connectionOk = false; renderStorageBar(); });
  }

  async function loadAll() {
    const url = getScriptUrl();
    if (!url) { properties = []; loadError = null; connectionOk = false; render(); return; }
    document.getElementById('psList').innerHTML = '<div class="ps-loading">Loading from your Google Sheet…</div>';
    try {
      properties = await apiList();
      connectionOk = true;
      loadError = null;
    } catch (e) {
      connectionOk = false;
      loadError = e.message || 'Could not reach the sheet';
    }
    render();
  }

  window.psToggleSettings = function() { settingsOpen = !settingsOpen; renderStorageBar(); };

  window.psSaveScriptUrl = function() {
    const val = document.getElementById('psScriptUrlInput').value.trim();
    if (!val) return;
    setScriptUrl(val);
    settingsOpen = false;
    loadAll();
  };

  function renderStorageBar() {
    const bar = document.getElementById('psStorageBar');
    const panel = document.getElementById('psSettingsPanel');
    const url = getScriptUrl();

    if (!url) {
      bar.innerHTML = '<span class="ps-storage-dot ps-storage-off"></span> Not connected to a Google Sheet — data won\'t be saved. ' +
        '<button class="ps-storage-link" onclick="psToggleSettings()">Connect now</button>';
    } else if (connectionOk) {
      bar.innerHTML = '<span class="ps-storage-dot ps-storage-ok"></span> Connected to your Google Sheet. ' +
        '<button class="ps-storage-link" onclick="psToggleSettings()">Change</button>';
    } else {
      bar.innerHTML = '<span class="ps-storage-dot ps-storage-off"></span> Can\'t reach the sheet' + (loadError ? ' (' + esc(loadError) + ')' : '') + '. ' +
        '<button class="ps-storage-link" onclick="loadAll()">Retry</button> · ' +
        '<button class="ps-storage-link" onclick="psToggleSettings()">Change URL</button>';
    }

    if (settingsOpen) {
      panel.innerHTML = '<input id="psScriptUrlInput" type="text" placeholder="Paste your Apps Script Web App URL…" value="' + esc(url) + '" />' +
        '<button class="ps-btn ps-btn-small" onclick="psSaveScriptUrl()">Save & connect</button>';
    } else {
      panel.innerHTML = '';
    }
  }

  window.loadAll = loadAll;

  function flattenValue(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    if (Array.isArray(v)) return v.map(flattenValue).filter(Boolean).join(', ');
    if (typeof v === 'object') {
      const priorityKeys = ['name', 'title', 'distance', 'time', 'duration', 'summary', 'text', 'description', 'value'];
      const linkKeys = ['link', 'url', 'mapsLink', 'googleMapsLink', 'gmapsLink'];
      const parts = [];
      priorityKeys.forEach(k => { if (v[k]) parts.push(String(v[k])); });
      Object.keys(v).forEach(k => {
        if (priorityKeys.includes(k) || linkKeys.includes(k)) return;
        if (v[k] !== null && v[k] !== undefined && v[k] !== '') parts.push(String(v[k]));
      });
      let linkPart = '';
      linkKeys.forEach(k => { if (v[k] && !linkPart) linkPart = String(v[k]); });
      let result = parts.join(' — ');
      if (linkPart) result += (result ? ' ' : '') + linkPart;
      return result.trim();
    }
    return String(v);
  }

  window.psAddProperty = function() {
    const linkEl = document.getElementById('psNewLink');
    const nickEl = document.getElementById('psNewNick');
    const link = linkEl.value.trim();
    if (!link) { linkEl.focus(); return; }
    const p = { id: uid(), link, nickname: nickEl.value.trim() || 'Untitled property', status: 'Researching', fields: {}, custom: [], notes: '', createdAt: Date.now() };
    properties.unshift(p);
    linkEl.value = ''; nickEl.value = '';
    saveProperty(p);
    expandedId = p.id;
    render();
  };

  window.psToggleExpand = function(id) {
    expandedId = (expandedId === id) ? null : id;
    render();
  };

  window.psUpdateNick = function(id, val) { const p = properties.find(x => x.id === id); if (!p) return; p.nickname = val; saveProperty(p); render(); };
  window.psUpdateStatus = function(id, val) { const p = properties.find(x => x.id === id); if (!p) return; p.status = val; saveProperty(p); render(); };
  window.psUpdateField = function(id, key, val) { const p = properties.find(x => x.id === id); if (!p) return; p.fields[key] = val; saveProperty(p); render(); };
  window.psUpdateNotes = function(id, val) { const p = properties.find(x => x.id === id); if (!p) return; p.notes = val; saveProperty(p); };
  window.psAddCustom = function(id) { const p = properties.find(x => x.id === id); if (!p) return; p.custom.push({ key: '', val: '' }); saveProperty(p); render(); };
  window.psUpdateCustom = function(id, idx, field, val) { const p = properties.find(x => x.id === id); if (!p) return; p.custom[idx][field] = val; saveProperty(p); };
  window.psDeleteCustom = function(id, idx) { const p = properties.find(x => x.id === id); if (!p) return; p.custom.splice(idx, 1); saveProperty(p); render(); };

  window.psDelete = function(id) {
    const p = properties.find(x => x.id === id);
    const label = p ? p.nickname : 'this property';
    if (confirm('Remove "' + label + '" from your tracker? This cannot be undone.')) {
      if (expandedId === id) expandedId = null;
      deleteProperty(id);
    }
  };

  window.psCopyPrompt = function(id) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    const prompt = 'Research this property for my tracker: ' + p.link + '\n\n' +
      'Please give me:\n' +
      '1. Car travel distance/time to Cyber Hub, Gurgaon\n' +
      '2. Walking time to the nearest Eurokids\n' +
      '3. Nearest park, with its Google Maps link\n' +
      '4. A quick review of the society/area reputation\n' +
      '5. Car travel time to the nearest mall\n' +
      '6. Has this area had waterlogging in the past (news search)\n\n' +
      'Reply with a fenced JSON block with these exact keys, all values as plain text strings (not nested objects): carTimeToCyberHub, walkingTimeToEurokids, nearestPark, areaReview, carTimeToMall, waterlogging.';
    navigator.clipboard.writeText(prompt).then(() => showMsg(id, 'Prompt copied — paste it to Claude in chat'))
      .catch(() => showMsg(id, 'Could not copy — select and copy manually'));
  };

  window.psImport = function(id) {
    const ta = document.getElementById('import_' + id);
    const raw = ta.value;
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) { showMsg(id, 'No JSON found in pasted text'); return; }
    let data;
    try { data = JSON.parse(match[0]); } catch (e) { showMsg(id, 'Could not parse JSON — check formatting'); return; }
    const p = properties.find(x => x.id === id);
    if (!p) return;
    FIELD_DEFS.forEach(f => {
      if (data[f.key] !== undefined && data[f.key] !== null) {
        p.fields[f.key] = flattenValue(data[f.key]);
      }
    });
    saveProperty(p);
    ta.value = '';
    showMsg(id, "Fields updated from Claude's reply");
    render();
  };

  function showMsg(id, text) {
    setTimeout(() => {
      const el = document.getElementById('msg_' + id);
      if (el) { el.textContent = text; setTimeout(() => { if (el) el.textContent = ''; }, 4000); }
    }, 0);
  }

  function extractDuration(val) {
    if (!val) return null;
    const m = val.match(/(\d+)\s*[-–to]{0,4}\s*(\d+)?\s*min/i);
    if (!m) return null;
    return m[2] ? (m[1] + '-' + m[2] + ' min') : (m[1] + ' min');
  }

  function shortChip(p) {
    const parts = [];
    const cyber = extractDuration(p.fields.carTimeToCyberHub);
    const euro = extractDuration(p.fields.walkingTimeToEurokids);
    if (cyber) parts.push('CyberHub ' + cyber);
    if (euro) parts.push('Eurokids ' + euro);
    if (parts.length) return parts.join(', ');
    if (p.fields.carTimeToCyberHub) return p.fields.carTimeToCyberHub.slice(0, 28) + (p.fields.carTimeToCyberHub.length > 28 ? '…' : '');
    return '—';
  }

  function extractUrl(val) {
    const m = (val || '').match(/https?:\/\/[^\s)]+/);
    return m ? m[0] : null;
  }

  function waterFlag(p) {
    const val = p.fields.waterlogging || '';
    if (!val) return { icon: '—', title: 'Not yet researched' };
    if (SAFE_WORDS.test(val)) return { icon: '✅', title: 'No significant waterlogging found' };
    if (RISK_WORDS.test(val)) return { icon: '⚠️', title: 'Waterlogging history found' };
    return { icon: '•', title: 'Researched — see details' };
  }

  function fieldToHtml(p, f) {
    const val = p.fields[f.key] || '';
    const url = extractUrl(val);
    return '<div class="ps-field">' +
      '<div class="ps-field-label"><span>' + esc(f.label) + '</span>' +
      (url ? '<a class="ps-field-link-btn" href="' + esc(url) + '" target="_blank" rel="noopener">↗ open</a>' : '') +
      '</div>' +
      '<div class="ps-field-value" contenteditable="true" ' +
      'onblur="psUpdateField(\'' + p.id + '\', \'' + f.key + '\', this.innerText.trim())">' + esc(val) + '</div>' +
      '</div>';
  }

  function customToHtml(p) {
    return p.custom.map((c, idx) =>
      '<div class="ps-custom-row">' +
      '<input class="ps-custom-key" placeholder="Detail (e.g. Price)" value="' + esc(c.key) + '" onblur="psUpdateCustom(\'' + p.id + '\', ' + idx + ', \'key\', this.value)" />' +
      '<input class="ps-custom-val" placeholder="Value" value="' + esc(c.val) + '" onblur="psUpdateCustom(\'' + p.id + '\', ' + idx + ', \'val\', this.value)" />' +
      '<button class="ps-custom-del" onclick="psDeleteCustom(\'' + p.id + '\', ' + idx + ')" aria-label="Remove detail">×</button>' +
      '</div>'
    ).join('');
  }

  function rowToHtml(p, i) {
    const isOpen = expandedId === p.id;
    const wf = waterFlag(p);
    const cyberChip = shortChip(p);

    const summary = '<div class="ps-row-summary" onclick="psToggleExpand(\'' + p.id + '\')">' +
      '<div class="ps-row-idx">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="ps-dot dot-' + p.status.toLowerCase() + '" title="' + p.status + '"></div>' +
      '<div class="ps-row-nick">' + esc(p.nickname) + '</div>' +
      '<div class="ps-row-chip" title="Car time to Cyber Hub">' + esc(cyberChip) + '</div>' +
      '<div class="ps-water-flag" title="' + esc(wf.title) + '">' + wf.icon + '</div>' +
      '<div class="ps-chevron' + (isOpen ? ' open' : '') + '">▶</div>' +
      '<button class="ps-row-del" onclick="event.stopPropagation(); psDelete(\'' + p.id + '\')" aria-label="Delete">🗑</button>' +
      '</div>';

    const detail = '<div class="ps-detail' + (isOpen ? ' open' : '') + '">' +
      '<input class="ps-nick-edit" value="' + esc(p.nickname) + '" onblur="psUpdateNick(\'' + p.id + '\', this.value.trim())" />' +
      '<a class="ps-link" href="' + esc(p.link) + '" target="_blank" rel="noopener">' + esc(p.link) + '</a>' +
      '<div class="ps-status-row">' +
        '<select class="ps-status-select" onchange="psUpdateStatus(\'' + p.id + '\', this.value)">' +
          STATUSES.map(s => '<option value="' + s + '"' + (s === p.status ? ' selected' : '') + '>' + s + '</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="ps-grid">' + FIELD_DEFS.map(f => fieldToHtml(p, f)).join('') + '</div>' +

      '<div class="ps-section-label">Research with Claude</div>' +
      '<div class="ps-prompt-row"><button class="ps-btn ps-btn-small" onclick="psCopyPrompt(\'' + p.id + '\')">Copy research prompt</button></div>' +
      '<textarea class="ps-import-box" id="import_' + p.id + '" placeholder="Paste Claude\'s reply here, then click Import…"></textarea>' +
      '<div class="ps-prompt-row" style="margin-top:8px;"><button class="ps-btn ps-btn-small" onclick="psImport(\'' + p.id + '\')">Import into fields</button></div>' +

      '<div class="ps-section-label">Additional details</div>' +
      '<div>' + customToHtml(p) + '</div>' +
      '<button class="ps-btn ps-btn-small" onclick="psAddCustom(\'' + p.id + '\')">+ Add detail</button>' +

      '<div class="ps-section-label">Notes</div>' +
      '<textarea class="ps-notes" placeholder="Anything else worth remembering…" onblur="psUpdateNotes(\'' + p.id + '\', this.value)">' + esc(p.notes) + '</textarea>' +

      '<div class="ps-status-msg" id="msg_' + p.id + '"></div>' +
    '</div>';

    return '<div class="ps-row">' + summary + detail + '</div>';
  }

  function render() {
    renderStorageBar();
    const list = document.getElementById('psList');
    const countEl = document.getElementById('psCount');
    const searchVal = (document.getElementById('psSearch').value || '').toLowerCase();
    const statusVal = document.getElementById('psFilterStatus').value;

    if (!getScriptUrl()) {
      list.innerHTML = '<div class="ps-empty">Connect a Google Sheet above to start saving properties.</div>';
      countEl.textContent = '';
      return;
    }
    if (loadError) {
      list.innerHTML = '<div class="ps-error-banner">Couldn\'t load your data: ' + esc(loadError) + '</div>';
      countEl.textContent = '';
      return;
    }

    let visible = properties;
    if (searchVal) visible = visible.filter(p => p.nickname.toLowerCase().includes(searchVal));
    if (statusVal) visible = visible.filter(p => p.status === statusVal);

    countEl.textContent = visible.length + ' of ' + properties.length + ' shown';

    if (properties.length === 0) {
      list.innerHTML = '<div class="ps-empty">No properties logged yet.<br/>Paste a Google Maps link above to start your first site survey.</div>';
      return;
    }
    if (visible.length === 0) {
      list.innerHTML = '<div class="ps-empty">No properties match this filter.</div>';
      return;
    }
    list.innerHTML = '<div class="ps-list">' + visible.map((p, i) => rowToHtml(p, i)).join('') + '</div>';
  }

  window.render = render;
  loadAll();
})();
</script>
</body>
</html>
