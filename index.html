<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Property Scout</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
body { margin: 0; }

.ps-root {
  --navy-deep: #101c33;
  --navy: #182a4a;
  --navy-light: #24406e;
  --paper: #eef1f6;
  --paper-dim: #b9c4d6;
  --cyan: #7fc7d9;
  --amber: #e2a33d;
  --red: #d9705f;
  --green: #6fb98f;
  font-family: 'Inter', sans-serif;
  background:
    linear-gradient(var(--navy-deep), var(--navy-deep)),
    repeating-linear-gradient(0deg, rgba(127,199,217,0.06) 0px, rgba(127,199,217,0.06) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, rgba(127,199,217,0.06) 0px, rgba(127,199,217,0.06) 1px, transparent 1px, transparent 28px);
  color: var(--paper);
  min-height: 100vh;
  padding: 32px 20px 60px;
  box-sizing: border-box;
}
.ps-root * { box-sizing: border-box; }

.ps-header {
  max-width: 980px;
  margin: 0 auto 28px;
  border-bottom: 1px solid var(--navy-light);
  padding-bottom: 20px;
}
.ps-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 6px;
}
.ps-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 30px;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.ps-sub {
  color: var(--paper-dim);
  font-size: 14px;
  margin: 0;
  max-width: 620px;
  line-height: 1.5;
}

.ps-container { max-width: 980px; margin: 0 auto; }

.ps-add-card {
  background: var(--navy);
  border: 1px solid var(--navy-light);
  border-radius: 4px;
  padding: 18px;
  margin-bottom: 28px;
}
.ps-add-row { display: flex; gap: 10px; flex-wrap: wrap; }
.ps-input {
  flex: 1;
  min-width: 220px;
  background: var(--navy-deep);
  border: 1px solid var(--navy-light);
  color: var(--paper);
  padding: 10px 12px;
  border-radius: 3px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
}
.ps-input::placeholder { color: var(--paper-dim); }
.ps-input:focus { outline: none; border-color: var(--cyan); }
.ps-input-nick { flex: 0 0 200px; min-width: 150px; }

.ps-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid var(--cyan);
  background: transparent;
  color: var(--cyan);
  padding: 10px 16px;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.ps-btn:hover { background: var(--cyan); color: var(--navy-deep); }
.ps-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.ps-btn-amber { border-color: var(--amber); color: var(--amber); }
.ps-btn-amber:hover { background: var(--amber); color: var(--navy-deep); }
.ps-btn-red { border-color: var(--red); color: var(--red); }
.ps-btn-red:hover { background: var(--red); color: var(--navy-deep); }
.ps-btn-small { padding: 6px 10px; font-size: 11px; }

.ps-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--paper-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  border: 1px dashed var(--navy-light);
  border-radius: 4px;
}

.ps-card {
  position: relative;
  background: var(--navy);
  border: 1px solid var(--navy-light);
  border-radius: 4px;
  margin-bottom: 22px;
  padding: 20px 22px 22px;
}
.ps-card::before, .ps-card::after,
.ps-corner-tl, .ps-corner-br {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--cyan);
  opacity: 0.6;
}
.ps-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.ps-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.ps-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.ps-card-idx {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: 0.1em;
}
.ps-nick {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 19px;
  font-weight: 600;
  margin: 2px 0 4px;
  background: transparent;
  border: none;
  color: var(--paper);
  width: 100%;
  padding: 0;
}
.ps-nick:focus { outline: none; border-bottom: 1px solid var(--cyan); }
.ps-link {
  font-size: 12px;
  color: var(--cyan);
  text-decoration: none;
  font-family: 'IBM Plex Mono', monospace;
  word-break: break-all;
}
.ps-link:hover { text-decoration: underline; }

.ps-status-select {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  background: var(--navy-deep);
  border: 1px solid var(--navy-light);
  color: var(--paper);
  padding: 7px 10px;
  border-radius: 3px;
  cursor: pointer;
}
.ps-status-select.st-shortlisted { color: var(--green); border-color: var(--green); }
.ps-status-select.st-visited { color: var(--cyan); border-color: var(--cyan); }
.ps-status-select.st-rejected { color: var(--red); border-color: var(--red); }
.ps-status-select.st-researching { color: var(--amber); border-color: var(--amber); }

.ps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin: 16px 0;
}
.ps-field {
  background: var(--navy-deep);
  border: 1px solid var(--navy-light);
  border-radius: 3px;
  padding: 10px 12px;
}
.ps-field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-bottom: 5px;
}
.ps-field-value {
  font-size: 13.5px;
  line-height: 1.4;
  min-height: 18px;
  outline: none;
  cursor: text;
}
.ps-field-value:empty::before { content: '— click to fill —'; color: var(--paper-dim); font-style: italic; }
.ps-field-value a { color: var(--cyan); }

.ps-section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin: 18px 0 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ps-section-label::after { content: ''; flex: 1; height: 1px; background: var(--navy-light); }

.ps-prompt-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

.ps-import-box {
  width: 100%;
  background: var(--navy-deep);
  border: 1px solid var(--navy-light);
  color: var(--paper);
  padding: 10px 12px;
  border-radius: 3px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  min-height: 60px;
  resize: vertical;
}
.ps-import-box:focus { outline: none; border-color: var(--cyan); }

.ps-notes {
  width: 100%;
  background: var(--navy-deep);
  border: 1px solid var(--navy-light);
  color: var(--paper);
  padding: 10px 12px;
  border-radius: 3px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  min-height: 50px;
  resize: vertical;
}
.ps-notes:focus { outline: none; border-color: var(--cyan); }

.ps-custom-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.ps-custom-row input {
  background: var(--navy-deep);
  border: 1px solid var(--navy-light);
  color: var(--paper);
  padding: 8px 10px;
  border-radius: 3px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
}
.ps-custom-key { flex: 0 0 160px; }
.ps-custom-val { flex: 1; }
.ps-custom-del {
  background: transparent;
  border: 1px solid var(--navy-light);
  color: var(--paper-dim);
  border-radius: 3px;
  cursor: pointer;
  padding: 0 10px;
  font-size: 14px;
}
.ps-custom-del:hover { color: var(--red); border-color: var(--red); }

.ps-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--navy-light);
}
.ps-status-msg {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--green);
  min-height: 14px;
}
.ps-loading {
  text-align: center;
  padding: 40px;
  color: var(--paper-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="ps-root" id="psRoot">
  <div class="ps-header">
    <div class="ps-eyebrow">SITE SURVEY LOG</div>
    <h1 class="ps-title">Property Scout</h1>
    <p class="ps-sub">Drop a Google Maps link for any property you're considering. Track commute times, nearby amenities, and area reputation — then keep adding detail as you qualify each one.</p>
  </div>

  <div class="ps-container">
    <div class="ps-add-card">
      <div class="ps-add-row">
        <input class="ps-input" id="psNewLink" type="text" placeholder="Paste Google Maps link…" />
        <input class="ps-input ps-input-nick" id="psNewNick" type="text" placeholder="Nickname (e.g. DLF Phase 3 - 2BHK)" />
        <button class="ps-btn ps-btn-amber" onclick="psAddProperty()">+ Add property</button>
      </div>
    </div>

    <div id="psList"><div class="ps-loading">Loading saved properties…</div></div>
  </div>
</div>

<script>
(function() {
  const FIELD_DEFS = [
    { key: 'carTimeToCyberHub', label: 'Car → Cyber Hub' },
    { key: 'walkingTimeToEurokids', label: 'Walk → Nearest Eurokids' },
    { key: 'nearestPark', label: 'Nearest Park' },
    { key: 'areaReview', label: 'Area / Society Review' },
    { key: 'carTimeToMall', label: 'Car → Nearest Mall' },
    { key: 'waterlogging', label: 'Waterlogging History' },
  ];
  const STATUSES = ['Researching', 'Shortlisted', 'Visited', 'Rejected'];
  let properties = [];

  function uid() { return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  const LS_PREFIX = 'propertyScout:';

  async function loadAll() {
    try {
      const idxRaw = localStorage.getItem(LS_PREFIX + 'index');
      const ids = idxRaw ? JSON.parse(idxRaw) : [];
      const loaded = [];
      for (const id of ids) {
        try {
          const rec = localStorage.getItem(LS_PREFIX + id);
          if (rec) loaded.push(JSON.parse(rec));
        } catch (e) { /* skip corrupt entry */ }
      }
      properties = loaded;
    } catch (e) {
      properties = [];
    }
    render();
  }

  async function saveIndex() {
    try {
      localStorage.setItem(LS_PREFIX + 'index', JSON.stringify(properties.map(p => p.id)));
    } catch (e) { console.error('index save failed', e); }
  }

  async function saveProperty(p) {
    try {
      localStorage.setItem(LS_PREFIX + p.id, JSON.stringify(p));
    } catch (e) { console.error('property save failed', e); }
  }

  async function deleteProperty(id) {
    try { localStorage.removeItem(LS_PREFIX + id); } catch (e) {}
    properties = properties.filter(p => p.id !== id);
    await saveIndex();
    render();
  }

  window.psAddProperty = async function() {
    const linkEl = document.getElementById('psNewLink');
    const nickEl = document.getElementById('psNewNick');
    const link = linkEl.value.trim();
    if (!link) { linkEl.focus(); return; }
    const p = {
      id: uid(),
      link: link,
      nickname: nickEl.value.trim() || 'Untitled property',
      status: 'Researching',
      fields: {},
      custom: [],
      notes: '',
      createdAt: Date.now(),
    };
    properties.unshift(p);
    linkEl.value = '';
    nickEl.value = '';
    await saveProperty(p);
    await saveIndex();
    render();
  };

  window.psUpdateNick = async function(id, val) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    p.nickname = val;
    await saveProperty(p);
  };

  window.psUpdateStatus = async function(id, val) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    p.status = val;
    await saveProperty(p);
    render();
  };

  window.psUpdateField = async function(id, key, val) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    p.fields[key] = val;
    await saveProperty(p);
  };

  window.psUpdateNotes = async function(id, val) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    p.notes = val;
    await saveProperty(p);
  };

  window.psAddCustom = async function(id) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    p.custom.push({ key: '', val: '' });
    await saveProperty(p);
    render();
  };

  window.psUpdateCustom = async function(id, idx, field, val) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    p.custom[idx][field] = val;
    await saveProperty(p);
  };

  window.psDeleteCustom = async function(id, idx) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    p.custom.splice(idx, 1);
    await saveProperty(p);
    render();
  };

  window.psDelete = async function(id) {
    if (confirm('Remove this property from your tracker?')) {
      await deleteProperty(id);
    }
  };

  window.psCopyPrompt = function(id, btn) {
    const p = properties.find(x => x.id === id);
    if (!p) return;
    const prompt = 'Research this property for my tracker: ' + p.link + '\n\n' +
      'Please give me:\n' +
      '1. Car travel distance/time to Cyber Hub, Gurgaon\n' +
      '2. Walking time to the nearest Eurokids\n' +
      '3. Nearest park, with its Google Maps link\n' +
      '4. A quick review of the society/area reputation\n' +
      '5. Car travel time to the nearest mall\n' +
      '6. Has this area had waterlogging in the past (news search)\n\n' +
      'Reply with a fenced JSON block with these exact keys: carTimeToCyberHub, walkingTimeToEurokids, nearestPark, areaReview, carTimeToMall, waterlogging.';
    navigator.clipboard.writeText(prompt).then(() => {
      showMsg(id, 'Prompt copied — paste it to Claude in chat');
    }).catch(() => {
      showMsg(id, 'Could not copy — select and copy manually');
    });
  };

  window.psImport = async function(id) {
    const ta = document.getElementById('import_' + id);
    const raw = ta.value;
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) { showMsg(id, 'No JSON found in pasted text'); return; }
    let data;
    try { data = JSON.parse(match[0]); } catch (e) { showMsg(id, 'Could not parse JSON — check formatting'); return; }
    const p = properties.find(x => x.id === id);
    if (!p) return;
    FIELD_DEFS.forEach(f => {
      if (data[f.key] !== undefined && data[f.key] !== null) {
        p.fields[f.key] = String(data[f.key]);
      }
    });
    await saveProperty(p);
    ta.value = '';
    showMsg(id, 'Fields updated from Claude\'s reply');
    render();
  };

  function showMsg(id, text) {
    const el = document.getElementById('msg_' + id);
    if (el) {
      el.textContent = text;
      setTimeout(() => { if (el) el.textContent = ''; }, 4000);
    }
  }

  function fieldToHtml(p, f) {
    const val = p.fields[f.key] || '';
    const isLink = f.key === 'nearestPark' && /https?:\/\//.test(val);
    return '<div class="ps-field">' +
      '<div class="ps-field-label">' + esc(f.label) + '</div>' +
      '<div class="ps-field-value" contenteditable="true" data-id="' + p.id + '" data-key="' + f.key + '" ' +
      'onblur="psUpdateField(\'' + p.id + '\', \'' + f.key + '\', this.innerText.trim())">' + esc(val) + '</div>' +
      '</div>';
  }

  function customToHtml(p) {
    return p.custom.map((c, idx) =>
      '<div class="ps-custom-row">' +
      '<input class="ps-custom-key" placeholder="Detail (e.g. Price)" value="' + esc(c.key) + '" ' +
      'onblur="psUpdateCustom(\'' + p.id + '\', ' + idx + ', \'key\', this.value)" />' +
      '<input class="ps-custom-val" placeholder="Value" value="' + esc(c.val) + '" ' +
      'onblur="psUpdateCustom(\'' + p.id + '\', ' + idx + ', \'val\', this.value)" />' +
      '<button class="ps-custom-del" onclick="psDeleteCustom(\'' + p.id + '\', ' + idx + ')" aria-label="Remove detail">×</button>' +
      '</div>'
    ).join('');
  }

  function cardToHtml(p, i) {
    const statusClass = 'st-' + p.status.toLowerCase();
    return '<div class="ps-card">' +
      '<div class="ps-card-head">' +
        '<div style="flex:1; min-width:200px;">' +
          '<div class="ps-card-idx">SITE ' + String(i + 1).padStart(2, '0') + '</div>' +
          '<div class="ps-nick" contenteditable="true" onblur="psUpdateNick(\'' + p.id + '\', this.innerText.trim())">' + esc(p.nickname) + '</div>' +
          '<a class="ps-link" href="' + esc(p.link) + '" target="_blank" rel="noopener">' + esc(p.link) + '</a>' +
        '</div>' +
        '<select class="ps-status-select ' + statusClass + '" onchange="psUpdateStatus(\'' + p.id + '\', this.value)">' +
          STATUSES.map(s => '<option value="' + s + '"' + (s === p.status ? ' selected' : '') + '>' + s + '</option>').join('') +
        '</select>' +
      '</div>' +

      '<div class="ps-grid">' + FIELD_DEFS.map(f => fieldToHtml(p, f)).join('') + '</div>' +

      '<div class="ps-section-label">Research with Claude</div>' +
      '<div class="ps-prompt-row">' +
        '<button class="ps-btn ps-btn-small" onclick="psCopyPrompt(\'' + p.id + '\', this)">Copy research prompt</button>' +
      '</div>' +
      '<textarea class="ps-import-box" id="import_' + p.id + '" placeholder="Paste Claude\'s reply here, then click Import…"></textarea>' +
      '<div class="ps-prompt-row" style="margin-top:8px;">' +
        '<button class="ps-btn ps-btn-small" onclick="psImport(\'' + p.id + '\')">Import into fields</button>' +
      '</div>' +

      '<div class="ps-section-label">Additional details</div>' +
      '<div id="custom_' + p.id + '">' + customToHtml(p) + '</div>' +
      '<button class="ps-btn ps-btn-small" onclick="psAddCustom(\'' + p.id + '\')">+ Add detail</button>' +

      '<div class="ps-section-label">Notes</div>' +
      '<textarea class="ps-notes" placeholder="Anything else worth remembering…" onblur="psUpdateNotes(\'' + p.id + '\', this.value)">' + esc(p.notes) + '</textarea>' +

      '<div class="ps-card-footer">' +
        '<div class="ps-status-msg" id="msg_' + p.id + '"></div>' +
        '<button class="ps-btn ps-btn-red ps-btn-small" onclick="psDelete(\'' + p.id + '\')">Remove</button>' +
      '</div>' +
    '</div>';
  }

  function render() {
    const list = document.getElementById('psList');
    if (properties.length === 0) {
      list.innerHTML = '<div class="ps-empty">No properties logged yet.<br/>Paste a Google Maps link above to start your first site survey.</div>';
      return;
    }
    list.innerHTML = properties.map((p, i) => cardToHtml(p, i)).join('');
  }

  loadAll();
})();
</script>
</body>
</html>
